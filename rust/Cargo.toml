[package]
name = "lattice-py"
version = "0.4.1"
edition = "2024"
publish = false

[lib]
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
lattice-engine = { version = "0.1.0", default-features = false }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }

[profile.release]
lto = true
codegen-units = 1
