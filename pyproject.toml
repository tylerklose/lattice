[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "lattice-cli"
version = "0.4.1"
description = "Deterministic combinatorial coverage for agent workflows and constrained variant surfaces."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Tyler Klose", email = "tylerklose@gmail.com" },
]
keywords = [
  "coding-agents",
  "combinatorial-testing",
  "component-variants",
  "pairwise-testing",
  "test-generation",
  "visual-testing",
  "coverage",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/tylerklose/lattice"
Repository = "https://github.com/tylerklose/lattice"
Issues = "https://github.com/tylerklose/lattice/issues"
Playground = "https://lattice.nolook.ai"

[project.scripts]
lattice = "lattice.cli:main"

[tool.maturin]
python-source = "src"
module-name = "lattice._engine"
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]
exclude = ["src/lattice_cli.egg-info/**"]
